# Local development overrides
version: '3.8'

services:
  api:
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./daily_hustle.db
      - SECRET_KEY=local-dev-secret-key
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

# Disable these for local dev with SQLite
  db:
    profiles: ["postgres"]
  redis:
    profiles: ["cache"]
