services:
  - type: web
    name: daily-hustle-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.render
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: daily-hustle-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: daily-hustle-db
    databaseName: dailyhustle
    user: dailyhustle
