services:
  - type: web
    name: daily-hustle-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: daily-hustle-db
          property: connectionString

databases:
  - name: daily-hustle-db
    databaseName: dailyhustle
    user: dailyhustle
